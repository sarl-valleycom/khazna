[program:khazna-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/khazna/artisan queue:work --sleep=3 --tries=3 --timeout=90
directory=/var/www/khazna
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/khazna-worker.log
stopwaitsecs=3600
